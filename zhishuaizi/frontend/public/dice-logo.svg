<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- 紫蓝渐变 - 与 DiceLogo 组件保持一致 -->
    <linearGradient id="diceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影效果 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <!-- 点的渐变 -->
    <radialGradient id="dotGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 骰子主体 - 使用变换模拟 3D 透视效果（rotateX(-20deg) rotateY(45deg)） -->
  <g transform="translate(50,50)">
    <!-- 应用透视变换，创建平行四边形效果 -->
    <!-- 使用 skew 和 scale 模拟 3D 透视：向左上方倾斜 -->
    <g transform="skewX(-12) skewY(-8) scale(1, 0.88)">
      <!-- 骰子面 - 圆角 12%，与 DiceLogo 组件一致 -->
      <rect x="-35" y="-35" width="70" height="70" rx="8.4" 
            fill="url(#diceGradient)" 
            filter="url(#shadow)"
            stroke="rgba(255,255,255,0.3)" 
            stroke-width="2"/>
      
      <!-- 6 点布局（2x3网格）- 与 DiceLogo 组件后面一致 -->
      <!-- 第一行：左、中、右 -->
      <circle cx="-14" cy="-14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
      <circle cx="0" cy="-14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
      <circle cx="14" cy="-14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
      <!-- 第二行：左、中、右 -->
      <circle cx="-14" cy="14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
      <circle cx="0" cy="14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
      <circle cx="14" cy="14" r="5.25" fill="url(#dotGradient)" opacity="0.95"/>
    </g>
  </g>
</svg>
