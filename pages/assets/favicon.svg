<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <!-- AI Text -->
  <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#accentGrad)" text-anchor="middle">AI</text>
  <!-- Decorative dots representing neural network -->
  <circle cx="12" cy="12" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="52" cy="12" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="12" cy="52" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="52" cy="52" r="3" fill="#ec4899" opacity="0.8"/>
  <!-- Connecting lines -->
  <line x1="12" y1="12" x2="32" y2="32" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="12" x2="32" y2="32" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="12" y1="52" x2="32" y2="32" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
  <line x1="52" y1="52" x2="32" y2="32" stroke="#ec4899" stroke-width="1" opacity="0.3"/>
</svg>
