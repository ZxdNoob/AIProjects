# GitHub Pages 多项目部署工作流
# 自动构建并部署所有子项目到 GitHub Pages

name: Deploy to GitHub Pages

on:
  # 推送到 master 分支时触发
  push:
    branches: ['master']
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      # ==================== 构建 FrontendPrepHub ====================
      - name: Install FrontendPrepHub dependencies
        working-directory: FrontendPrepHub/frontend
        run: npm install

      - name: Build FrontendPrepHub
        working-directory: FrontendPrepHub/frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /AIProjects/FrontendPrepHub/

      # ==================== 构建 zhishuaizi ====================
      - name: Install zhishuaizi dependencies
        working-directory: zhishuaizi/frontend
        run: npm install

      - name: Build zhishuaizi
        working-directory: zhishuaizi/frontend
        run: npm run build
        env:
          VITE_BASE_PATH: /AIProjects/zhishuaizi/

      # ==================== 组装部署目录 ====================
      - name: Setup Pages directory
        run: |
          mkdir -p ./dist
          # 复制主页
          cp ./pages/index.html ./dist/
          cp -r ./pages/assets ./dist/ 2>/dev/null || true
          # 复制子项目构建产物
          mkdir -p ./dist/FrontendPrepHub
          mkdir -p ./dist/zhishuaizi
          cp -r ./FrontendPrepHub/frontend/dist/* ./dist/FrontendPrepHub/
          cp -r ./zhishuaizi/frontend/dist/* ./dist/zhishuaizi/
          # 为 SPA 路由创建 404.html（复制 index.html）
          cp ./dist/FrontendPrepHub/index.html ./dist/FrontendPrepHub/404.html
          cp ./dist/zhishuaizi/index.html ./dist/zhishuaizi/404.html
          # 创建 .nojekyll 文件禁用 Jekyll 处理
          touch ./dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
